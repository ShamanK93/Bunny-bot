<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Espace client BunnyBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-screen">
    <div id="login-box">
      <div class="brand"><img src="../signup/assets/bunny-mascot.png" alt="BunnyBot" /> BunnyBot</div>
      <p class="hint">Connectez-vous pour gérer votre bot et votre abonnement.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />

        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" />

        <button type="submit" id="login-btn">Se connecter</button>
      </form>
      <div id="login-error"></div>

      <p class="signup-hint">Pas encore de compte ? <a href="../signup/">Démarrer un essai</a></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
