<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bienvenue chez BunnyBot</title>
  <link rel="icon" href="assets/bunny-face.png" type="image/png" />
  <link rel="stylesheet" href="../shared/brand.css" />
  <style>
    body { background: var(--nuit); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .top { padding: 20px 24px; }
    .top .brand-mark { color: #fff; }
    main { flex: 1; display: grid; place-items: center; padding: 24px 24px 72px; }
    .panel { max-width: 560px; display: grid; gap: 20px; justify-items: start; }
    .bunny { width: 200px; margin: 0 0 -8px -12px; }
    h1 { font-family: var(--font-display); font-size: clamp(34px, 6vw, 52px); line-height: 1.04; letter-spacing: -0.03em; font-weight: 700; margin: 0; }
    p { margin: 0; font-size: 18px; line-height: 1.6; color: rgba(255, 255, 255, 0.78); }
    .btn { padding: 15px 28px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="top">
    <a href="index.html" class="brand-mark">
      <span class="logo"><img src="assets/bunny-face.png" alt="" /></span>
      BunnyBot
    </a>
  </div>
  <main>
    <div class="panel">
      <img class="bunny" src="assets/bunny-full.png" alt="" />
      <h1>C'est parti, votre essai de 14 jours a démarré.</h1>
      <p>
        Rendez-vous dans votre espace pour personnaliser le message d'accueil
        de votre bot et récupérer votre code d'installation.
      </p>
      <a href="../portal/" class="btn">Ouvrir mon espace</a>
    </div>
  </main>
</body>
</html>
